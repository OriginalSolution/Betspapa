apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def fcmServices = file('google-services.json')
def fcmEnabled = fcmServices.exists() && fcmServices.length() > 2

android {
    namespace = "com.betspapa.scores"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.betspapa.scores"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 62
        versionName "0.4.39" // Play build copies codes, uses FCM alerts, and does not open a bookmaker
        buildConfigField "boolean", "FCM_ENABLED", fcmEnabled ? "true" : "false"
        buildConfigField "boolean", "PLAY_STORE", System.getenv("STORE_BUILD") == "play" ? "true" : "false"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing comes from the environment (CI secrets or the box secrets folder), never from the repo.
    // Play bundles use the upload key; the legacy GitHub APK uses the original app signing key. See README "Signing".
    def signingStore = System.getenv("BETSPAPA_STORE_FILE")
    def releaseSigned = signingStore != null && !signingStore.isEmpty()
    signingConfigs {
        if (releaseSigned) {
            release {
                storeFile file(signingStore)
                storePassword System.getenv("BETSPAPA_STORE_PASSWORD")
                keyAlias System.getenv("BETSPAPA_KEY_ALIAS")
                keyPassword System.getenv("BETSPAPA_KEY_PASSWORD") ?: System.getenv("BETSPAPA_STORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigned) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    sourceSets {
        main {
            java.srcDirs += fcmEnabled ? 'src/fcm/java' : 'src/nofcm/java'
            if (fcmEnabled) kotlin.srcDirs += 'src/fcm/kotlin'
        }
    }
}

def playStore = System.getenv("STORE_BUILD") == "play"
androidComponents {
    onVariants(selector().all()) { variant ->
        if (playStore) {
            variant.sources.manifests.addStaticManifestFile("src/play/AndroidManifest.xml")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

configurations.configureEach {
    // Play services ships an empty listenablefuture jar that hides the real class WorkManager needs.
    exclude group: 'com.google.guava', module: 'listenablefuture'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':watch-core')
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.android.billingclient:billing:8.0.0'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.guava:guava:33.3.1-android'
    if (fcmEnabled) {
        implementation platform('com.google.firebase:firebase-bom:33.7.0')
        implementation 'com.google.firebase:firebase-messaging'
    }
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
