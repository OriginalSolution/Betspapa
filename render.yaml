services:
  - type: web
    name: betspapa
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_MODE
        value: demo
      - key: FOOTBALL_DATA_API_KEY
        sync: false
