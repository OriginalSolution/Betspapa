<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Betspapa is a football matchday board with live scores and alerts for kick-off, goals, red cards, half-time and full-time."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Betspapa" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Betspapa</title>
    <style>
      html, body { background: #000; margin: 0; }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        transition: opacity 420ms ease;
      }
      #boot-splash.is-gone { opacity: 0; pointer-events: none; }
      #boot-splash svg { width: min(32vw, 168px); height: auto; }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="img" aria-label="Betspapa">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" rx="22" fill="#E11D2E"/>
        <rect x="30" y="22" width="36" height="25" fill="#fff"/>
        <rect x="30" y="22" width="10" height="56" fill="#fff"/>
        <rect x="30" y="50" width="40" height="28" fill="#fff"/>
        <rect x="50" y="32" width="8" height="8" fill="#E11D2E"/>
        <rect x="51" y="60" width="9" height="9" fill="#E11D2E"/>
      </svg>
    </div>
    <script>document.documentElement.dataset.boot = String(Date.now());</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
