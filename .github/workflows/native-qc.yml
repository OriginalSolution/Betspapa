name: Native QC
# Photographs the debug app on an emulator against api.betspapa.com.
# It never creates a GitHub release, pushes a tag, or uploads to Play.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/native-qc.yml
      - scripts/native-qc.sh
      - android/app/src/androidTest/java/com/betspapa/scores/watch/AgreeQcTest.java
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [sideload, play]
    env:
      STORE_BUILD: ${{ matrix.flavor == 'play' && 'play' || '' }}
      VITE_STORE_BUILD: ${{ matrix.flavor == 'play' && 'play' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Confirm this is the 0.4.40 build
        run: |
          set -euo pipefail
          grep -q 'versionCode 63' android/app/build.gradle
          grep -q 'versionName "0.4.40"' android/app/build.gradle
          grep -q "APP_VERSION = '0.4.40'" src/lib/appVersion.ts
      - run: npm run build
      - run: npx cap sync android
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Assemble debug app and test
        working-directory: android
        run: |
          set -euo pipefail
          # Maven sometimes answers 429 while Gradle resolves plugins. A real compile failure still fails the job.
          for attempt in 1 2 3 4 5; do
            if ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest; then
              exit 0
            fi
            echo "Assemble failed on attempt ${attempt}."
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 30))
          done
      - name: Emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          ram-size: 3072M
          cores: 2
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            bash scripts/native-qc.sh ${{ matrix.flavor }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-qc-${{ matrix.flavor }}
          path: native-qc-shots/
          if-no-files-found: warn
          retention-days: 14
