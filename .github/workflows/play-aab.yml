name: Play bundle
# Builds the signed release .aab for Google Play internal testing and keeps it as a workflow artifact.
# It never creates a GitHub release, pushes a tag, or uploads to Play.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/play-aab.yml
      - android/app/build.gradle
      - android/app/src/main/AndroidManifest.xml
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon :watch-core:test :app:testReleaseUnitTest
      - name: Build signed release bundle
        working-directory: android
        # Signed with the same upload key as v0.4.10 (signingConfigs.release in android/app/build.gradle).
        run: ./gradlew --no-daemon :app:bundleRelease
      - name: Check version, target SDK, FCM and signing
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          curl -sSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          MANIFEST=$(java -jar bundletool.jar dump manifest --bundle "$AAB")
          echo "$MANIFEST" | grep -o 'android:versionCode="[0-9]*"\|android:versionName="[^"]*"\|android:targetSdkVersion="[0-9]*"' | sort -u
          echo "$MANIFEST" | grep -q 'android:versionCode="34"'
          echo "$MANIFEST" | grep -q 'android:versionName="0.4.11"'
          TARGET=$(echo "$MANIFEST" | grep -o 'android:targetSdkVersion="[0-9]*"' | grep -o '[0-9]*')
          test "$TARGET" -ge 35
          if echo "$MANIFEST" | grep -q 'USE_EXACT_ALARM'; then echo "USE_EXACT_ALARM must not ship to Play"; exit 1; fi
          echo "$MANIFEST" | grep -q 'BetspapaFirebaseService'
          BUNDLE_SHA=$(keytool -printcert -jarfile "$AAB" | grep -m1 'SHA256:' | awk '{print $2}')
          curl -sSL -o previous.apk https://github.com/OriginalSolution/Betspapa/releases/download/v0.4.10/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          PREVIOUS_SHA=$("$APKSIGNER" verify --print-certs previous.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "bundle signer   $BUNDLE_SHA"
          echo "v0.4.10 signer  $PREVIOUS_SHA"
          test "$BUNDLE_SHA" = "$PREVIOUS_SHA"
          sha256sum "$AAB"
      - uses: actions/upload-artifact@v4
        with:
          name: betspapa-0.4.11-vc34-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
