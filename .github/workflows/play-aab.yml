name: Play bundle
# Builds the signed release .aab for Google Play internal testing and keeps it as a workflow artifact.
# It never creates a GitHub release, pushes a tag, or uploads to Play.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/play-aab.yml
      - android/app/build.gradle
      - android/app/src/main/AndroidManifest.xml
      - android/app/src/debug/AndroidManifest.xml
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Read version from build.gradle
        id: version
        run: |
          set -euo pipefail
          CODE=$(grep -m1 -o 'versionCode [0-9]*' android/app/build.gradle | awk '{print $2}')
          NAME=$(grep -m1 -o 'versionName "[^"]*"' android/app/build.gradle | cut -d'"' -f2)
          grep -q "APP_VERSION = '$NAME'" src/lib/appVersion.ts || { echo "src/lib/appVersion.ts does not say $NAME"; exit 1; }
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - run: npx cap sync android
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon :watch-core:test :app:testReleaseUnitTest
      - name: Build signed release bundle
        working-directory: android
        # Signed with the private Play upload key from repository secrets. Nothing is written outside the runner.
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          BETSPAPA_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          BETSPAPA_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEYSTORE_BASE64" || { echo "PLAY_UPLOAD_KEYSTORE_BASE64 secret is missing"; exit 1; }
          export BETSPAPA_STORE_FILE="$RUNNER_TEMP/upload.keystore"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$BETSPAPA_STORE_FILE"
          ./gradlew --no-daemon :app:bundleRelease
          rm -f "$BETSPAPA_STORE_FILE"
      - name: Check version, target SDK, FCM and signing
        env:
          # Public certificate fingerprint of the Play upload key (not a secret).
          EXPECTED_UPLOAD_SHA256: D0:B4:D5:86:87:33:F9:3E:05:50:77:FB:47:27:E4:D5:28:D4:25:65:D9:8C:7C:13:A5:8E:F7:84:3B:3C:A5:E7
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          curl -sSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          MANIFEST=$(java -jar bundletool.jar dump manifest --bundle "$AAB")
          echo "$MANIFEST" | grep -o 'android:versionCode="[0-9]*"\|android:versionName="[^"]*"\|android:targetSdkVersion="[0-9]*"' | sort -u
          echo "$MANIFEST" | grep -q 'android:versionCode="${{ steps.version.outputs.code }}"'
          echo "$MANIFEST" | grep -q 'android:versionName="${{ steps.version.outputs.name }}"'
          TARGET=$(echo "$MANIFEST" | grep -o 'android:targetSdkVersion="[0-9]*"' | grep -o '[0-9]*')
          test "$TARGET" -ge 35
          if echo "$MANIFEST" | grep -q 'USE_EXACT_ALARM'; then echo "USE_EXACT_ALARM must not ship to Play"; exit 1; fi
          echo "$MANIFEST" | grep -q 'BetspapaFirebaseService'
          BUNDLE_SHA=$(keytool -printcert -jarfile "$AAB" | grep -m1 'SHA256:' | awk '{print $2}')
          echo "bundle signer  $BUNDLE_SHA"
          echo "upload key     $EXPECTED_UPLOAD_SHA256"
          test "$BUNDLE_SHA" = "$EXPECTED_UPLOAD_SHA256"
          sha256sum "$AAB"
      - uses: actions/upload-artifact@v4
        with:
          name: betspapa-${{ steps.version.outputs.name }}-vc${{ steps.version.outputs.code }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
