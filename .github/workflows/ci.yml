name: CI
on:
  pull_request:
  push:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Monitor check messages
        working-directory: .github/monitor
        run: python3 -m unittest test_judge.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test
      - run: npm run build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Android unit tests (alert planner, gate, cards)
        working-directory: android
        run: |
          set -euo pipefail
          # Maven sometimes answers 429 while Robolectric jars download. A real test failure still fails the job.
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :watch-core:test :app:testReleaseUnitTest; then
              exit 0
            fi
            echo "Unit tests failed on attempt ${attempt}."
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 25))
          done
